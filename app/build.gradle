plugins { id 'com.android.application' }
android {
    namespace 'edu.multisense.collector'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'edu.multisense.collector'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.1.1'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { debug { if (System.getenv('MULTISENSE_DEBUG_KEYSTORE')) storeFile file(System.getenv('MULTISENSE_DEBUG_KEYSTORE')) } }
    buildTypes { release { minifyEnabled false } }
}
